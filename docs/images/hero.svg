<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PromptBox — 本地优先的 Chrome 提示词本</title>
  <desc id="heroDesc">左侧为产品名 PromptBox 与一句话价值，右侧是一张提示词卡片示意：标题、正文骨架、文件夹与标签，以及复制按钮。</desc>

  <rect width="1200" height="400" rx="24" fill="#f9f8f6"/>

  <g id="title-block">
    <text x="72" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8a847f" letter-spacing="2">CHROME 扩展 · 本地优先</text>

    <text x="72" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="78" font-weight="600" fill="#2c2a29" letter-spacing="-1">PromptBox</text>

    <text x="72" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#5c5652">把好用的提示词，留得住 · 找得回 · 拿得走</text>

    <g id="three-steps">
      <circle cx="81" cy="300" r="5" fill="#c77560"/>
      <text x="98" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6b625e">记录</text>
      <circle cx="181" cy="300" r="5" fill="#c77560"/>
      <text x="198" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6b625e">分类</text>
      <circle cx="281" cy="300" r="5" fill="#c77560"/>
      <text x="298" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6b625e">取用</text>
    </g>

    <text x="72" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#a49d97">数据只存本地 · 无账号 · host_permissions 为空</text>
  </g>

  <g id="prompt-card">
    <rect x="722" y="106" width="408" height="248" rx="16" fill="#000000" opacity="0.04"/>
    <rect x="712" y="96" width="408" height="248" rx="16" fill="#fffdfc" stroke="#e8e3de" stroke-width="1"/>

    <text x="744" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#2c2a29">把零散进展整理成一页周报</text>

    <rect x="744" y="172" width="320" height="10" rx="5" fill="#f0ebe6"/>
    <rect x="744" y="192" width="282" height="10" rx="5" fill="#f0ebe6"/>
    <rect x="744" y="212" width="204" height="10" rx="5" fill="#f0ebe6"/>

    <line x1="744" y1="240" x2="1088" y2="240" stroke="#e8e3de" stroke-width="1"/>

    <rect x="744" y="256" width="108" height="30" rx="15" fill="#f0ebe6"/>
    <text x="798" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#6b625e">写作与表达</text>

    <rect x="864" y="256" width="64" height="30" rx="15" fill="#f0ebe6"/>
    <text x="896" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#6b625e">#工作</text>

    <rect x="940" y="256" width="64" height="30" rx="15" fill="#f0ebe6"/>
    <text x="972" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#6b625e">#总结</text>

    <rect x="1020" y="256" width="68" height="30" rx="8" fill="#c77560"/>
    <text x="1054" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#ffffff">复制</text>
  </g>
</svg>
